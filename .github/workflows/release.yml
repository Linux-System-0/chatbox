name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.0.12077973"

jobs:
  # Every job pins `ubuntu-24.04` instead of `ubuntu-latest`: the released
  # x86_64 binary links the runner's glibc, so an image rollover would silently
  # raise the minimum glibc for users (see docs/release.md).
  # Reuse the CI gate's reusable workflow instead of keeping a second copy of
  # the checks here: the release must be built from a tree that passed exactly
  # what main is gated on.
  verify:
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.ref }}

  backend:
    name: Build server binaries
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: "backend -> target"
          key: release-backend

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild

      - name: Build x86_64
        working-directory: backend
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Build arm64
        working-directory: backend
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu

      - name: Stage binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          cp backend/target/x86_64-unknown-linux-gnu/release/chatbox-server \
            dist/chatbox-server-x86_64-unknown-linux
          cp backend/target/aarch64-unknown-linux-gnu/release/chatbox-server \
            dist/chatbox-server-arm64-unknown-linux
          chmod +x dist/chatbox-server-*

      - name: Strip binaries
        run: |
          set -euo pipefail
          LLVM_STRIP="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-strip"
          test -x "$LLVM_STRIP"
          # llvm-strip is target-agnostic, so it covers the zigbuild artifact too.
          for binary in dist/chatbox-server-*; do
            "$LLVM_STRIP" --strip-all "$binary"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-binaries
          path: dist/chatbox-server-*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build signed APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin"

          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          # `yes` exits with SIGPIPE once sdkmanager stops reading; that is not a
          # failure, so the pipeline is allowed to short-circuit here.
          yes | "$CMDLINE_TOOLS/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true

          "$CMDLINE_TOOLS/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          test -x "$BUILD_TOOLS_DIR/apksigner"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Align and sign APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$(find "$OUTPUT_DIR" -maxdepth 1 -name '*-unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::assembleRelease did not produce an unsigned APK"
            exit 1
          fi

          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$OUTPUT_DIR/app-release.apk"

          # zipalign must run before signing so the APK can be mapped in place.
          zipalign -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          apksigner verify --verbose --print-certs "$SIGNED_APK"

      - name: Check Android network policy (packaged APK)
        run: |
          node scripts/check-android-network-policy.mjs \
            --require-apk \
            --apk=android/app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/chatbox-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: dist/chatbox-android.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks" "$RUNNER_TEMP/app-release-aligned.apk"

  release:
    name: Publish release
    needs: [backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify the tag is signed
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin || echo "::warning::could not fetch tags from origin"

          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG is not present in the repository"
            exit 1
          fi

          TAG_TYPE="$(git cat-file -t "$TAG")"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::$TAG is not an annotated tag; releases require signed annotated tags (AGENTS.md §5)"
            exit 1
          fi

          # The signature is appended to the tag object, so this check works
          # without importing the signer's public key.
          TAG_OBJECT="$(git cat-file -p "$TAG")"
          case "$TAG_OBJECT" in
            *"BEGIN PGP SIGNATURE"*) ;;
            *)
              echo "::error::$TAG is not GPG-signed; create it with: git tag -s $TAG -m \"$TAG\""
              exit 1
              ;;
          esac

      - name: Write checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          # Write outside the directory: the redirected file is created before
          # `*` expands, so writing in place would hash an empty SHA256SUMS.txt
          # and publish a checksum of itself.
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" .

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --latest
