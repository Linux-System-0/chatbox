[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/plugin",
    "crates/api",
    "crates/realtime",
    "crates/workers",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Linux-System-0 <ls0_1@qq.com>"]
repository = "https://github.com/Linux-System-0/chatbox"

[workspace.dependencies]
chatbox-core = { path = "crates/core" }
chatbox-storage = { path = "crates/storage" }
chatbox-plugin = { path = "crates/plugin" }
chatbox-api = { path = "crates/api" }
chatbox-realtime = { path = "crates/realtime" }
chatbox-workers = { path = "crates/workers" }

async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
jsonwebtoken = "9"
libloading = "0.8"
argon2 = "0.5"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "uuid", "json", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "streams"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
