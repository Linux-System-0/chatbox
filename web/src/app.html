<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#5b5bd6" />
		<script>
			// Apply the stored theme before first paint to avoid a flash of the
			// wrong color scheme while Svelte is hydrating.
			try {
				var stored = localStorage.getItem('chatbox.theme');
				if (stored === 'dark' || stored === 'light') {
					document.documentElement.dataset.theme = stored;
				}
			} catch (e) {
				// localStorage may be unavailable; default to the light theme.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
